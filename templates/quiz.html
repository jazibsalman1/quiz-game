<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Random Quiz</title>
    <style>
       

/* BODY */
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* TITLE */
h1 {
    margin-top: 30px;
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
}

/* FORM */
form {
    width: 90%;
    max-width: 800px;
    margin-top: 30px;
    background: rgba(255,255,255,0.08);
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

/* QUESTION BOX */
.question {
    margin-bottom: 25px;
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    transition: 0.3s;
}

.question:hover {
    transform: scale(1.01);
    background: rgba(255,255,255,0.1);
}

/* QUESTION TEXT */
.question p {
    font-size: 1.2rem;
    font-weight: bold;
    margin-bottom: 10px;
}

/* OPTIONS */
.options label {
    display: block;
    margin: 8px 0;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    background: rgba(255,255,255,0.07);
    transition: 0.3s;
}

.options label:hover {
    background: rgba(0, 255, 255, 0.2);
    transform: translateX(5px);
}

/* RADIO BUTTON */
input[type="radio"] {
    margin-right: 10px;
    transform: scale(1.2);
}

/* BUTTON */
button {
    margin-top: 20px;
    padding: 15px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: linear-gradient(90deg, #ff00cc, #3333ff);
    color: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: 0.3s ease;
}

/* BUTTON HOVER */
button:hover {
    transform: scale(1.1);
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}

/* RESPONSIVE */
@media (max-width: 600px) {
    h1 {
        font-size: 2rem;
    }
}
</style>
    
</head>
<body>

<h1>Random Quiz</h1>

<form method="post" action="/submit">

    {% for q in questions %}
    <div class="question">
        <p><b>{{ loop.index }}. {{ q.question|safe }}</b></p>
        <div class="options">
            {% for opt in q.options %}
            <label>
                <input type="radio" name="answer_{{ q.id }}" value="{{ opt|safe }}" required>
                {{ opt|safe }}
            </label>
            {% endfor %}
        </div>
    </div>
    {% endfor %}

    <button type="submit">Submit Quiz</button>
</form>

</body>
</html>
