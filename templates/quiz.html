<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Random Quiz</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .question { margin-bottom: 20px; }
        .options label { display: block; margin: 5px 0; }
        button { padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>

<h1>Random Quiz</h1>

<form method="post" action="/submit">

    {% for q in questions %}
    <div class="question">
        <p><b>{{ loop.index }}. {{ q.question|safe }}</b></p>
        <div class="options">
            {% for opt in q.options %}
            <label>
                <input type="radio" name="answer_{{ q.id }}" value="{{ opt|safe }}" required>
                {{ opt|safe }}
            </label>
            {% endfor %}
        </div>
    </div>
    {% endfor %}

    <button type="submit">Submit Quiz</button>
</form>

</body>
</html>
